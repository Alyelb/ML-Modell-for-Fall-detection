name: Build and commit LaTeX PDF

on:
  push:
    paths:
      - 'LateX_Code/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # allow push with GITHUB_TOKEN

      - name: Compile LaTeX (latexmk)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: LateX_Code/main.tex
          latexmk_use_lualatex: false

      - name: Commit generated PDF back to repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "build: update compiled PDF"
          file_pattern: "LateX_Code/main.pdf"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
